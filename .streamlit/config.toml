[theme.light]
primaryColor = "#f97316"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f5f2"
textColor = "#1f2937"
borderColor = "#e5e7eb"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap"
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = false

[theme.dark]
primaryColor = "#fb923c"
backgroundColor = "#0b0b0d"
secondaryBackgroundColor = "#141417"
textColor = "#f5f5f7"
borderColor = "#2a2a2e"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap"
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = false

[theme.light.sidebar]
backgroundColor = "#f7f5f2"

[theme.dark.sidebar]
backgroundColor = "#000000"
